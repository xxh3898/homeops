name: homeops-readiness-test

services:
  db:
    image: postgres:18.4-alpine3.24
    restart: "no"
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: homeops
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: ${HOMEOPS_READINESS_DB_PASSWORD:?HOMEOPS_READINESS_DB_PASSWORD must be set}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    tmpfs:
      - /var/lib/postgresql:size=384m,mode=0755
    networks:
      - application

  migration:
    image: homeops-api:readiness-test
    restart: "no"
    read_only: true
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    entrypoint:
      - java
      - -Dloader.main=dev.homeops.ops.MigrationMain
      - -cp
      - /app/homeops.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/homeops
      SPRING_DATASOURCE_USERNAME: homeops
      SPRING_DATASOURCE_PASSWORD: ${HOMEOPS_READINESS_DB_PASSWORD:?HOMEOPS_READINESS_DB_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application

  api:
    image: homeops-api:readiness-test
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: "no"
    init: true
    read_only: true
    mem_limit: 640m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=96m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/homeops
      SPRING_DATASOURCE_USERNAME: homeops
      SPRING_DATASOURCE_PASSWORD: ${HOMEOPS_READINESS_DB_PASSWORD:?HOMEOPS_READINESS_DB_PASSWORD must be set}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
      HOMEOPS_ALLOWED_USERS: owner@example.invalid
      HOMEOPS_AGENT_ID: readiness-test-agent
      HOMEOPS_FLYWAY_ENABLED: "false"
      HOMEOPS_SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - application
      - egress

  web:
    image: homeops-web:readiness-test
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    restart: "no"
    init: true
    read_only: true
    mem_limit: 64m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
      - /tmp:size=16m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${HOMEOPS_READINESS_TLS_DIR:?HOMEOPS_READINESS_TLS_DIR must be set}:/run/homeops/tls:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    networks:
      - application

networks:
  application:
    internal: true
  egress:
    internal: false
