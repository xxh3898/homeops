name: Bug / Regression
description: 재현 가능한 bug, regression 또는 운영 이상을 수정 가능한 계약으로 기록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        기존 Issue를 먼저 확인하세요. Secret, credential, private deployment metadata, private address 또는 Tailnet 상세는 첨부하지 마세요. 민감한 보안 문제는 `SECURITY.md`의 비공개 제보 경로를 사용하세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 무엇이 잘못됐고 언제부터 관찰됐는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 재현 가능하면 최소 단계와 조건을 적어주세요. 재현할 수 없으면 관찰 조건을 적어주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상이라면 어떤 결과여야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 관찰된 결과와 오류 상태를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: fix_scope
    attributes:
      label: Fix Scope
      description: 원인을 해결하기 위해 변경할 범위와 변경하지 않을 범위를 구분해 적어주세요.
      placeholder: |
        IN:
        OUT:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 재현 test, 정상 동작과 failure case를 포함한 완료 기준을 적어주세요.
      placeholder: |
        - [ ] 재현 test
        - [ ] fix evidence
        - [ ] regression evidence
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression Strategy
      description: Focused, 관련 회귀, 전체 검증과 Hosted CI에서 다시 확인할 항목을 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 영향 범위
      description: 확인된 범위를 모두 선택하세요.
      multiple: true
      options:
        - Backend
        - Frontend
        - Agent
        - Infrastructure / CI/CD
        - Database
        - Documentation
        - GitHub configuration
        - Production
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 환경
      options:
        - Production
        - Local
        - CI
        - Other
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: 현재 확인된 영향 기준으로 선택하세요. 조사 후 변경할 수 있습니다.
      options:
        - P0 — 전체 서비스 중단 또는 데이터 안전에 심각한 위험
        - P1 — Production 핵심 기능 또는 배포 경계 문제
        - P2 — 중요하지만 즉각적인 outage는 아닌 문제
        - P3 — 낮은 우선순위의 제한된 문제
    validations:
      required: true

  - type: textarea
    id: impacts
    attributes:
      label: Contract / Impact
      description: 수정이 production, data, security, Agent와 public contract에 미치는 영향을 적어주세요.
      placeholder: |
        API / Behavior:
        Production runtime:
        Data / Migration:
        Security / Privacy:
        Agent artifact / release:
        Documentation:
    validations:
      required: true

  - type: textarea
    id: delivery
    attributes:
      label: Delivery / Recovery Gate
      description: Branch와 PR target, 배포·migration·Agent·Secret 영향, rollback과 post-merge 확인을 적어주세요.
      placeholder: |
        Expected Branch:
        PR Target: dev | main release | other
        Production Mutation:
        DB migration compatibility:
        API/Web deployment:
        Agent artifact / release classification:
        Secret / credential:
        Preflight Gate:
        Rollback / Recovery:
        Post-merge Acceptance:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: 관련 log의 redacted 발췌, screenshot, Actions run 또는 commit을 적어주세요. Secret, credential, private deployment metadata는 포함하지 마세요.
    validations:
      required: false
