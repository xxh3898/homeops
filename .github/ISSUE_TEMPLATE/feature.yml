name: Feature / Improvement
description: 신규 기능 또는 범위가 명확한 개선을 실행 가능한 계약으로 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        구현 방법보다 해결할 문제와 검증 가능한 완료 조건을 먼저 작성하세요.
        이 Issue는 구현 agent의 실행 계약입니다. 실제 Secret, credential, private endpoint 또는 private deployment metadata를 기록하지 마세요.

  - type: textarea
    id: background
    attributes:
      label: 문제 / 배경
      description: 현재 어떤 제약이나 불편이 있으며 왜 해결해야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 완료되면 사용자나 운영 상태가 어떻게 달라져야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: IN Scope
      description: 이번 Issue와 한 Feature PR에서 구현할 항목을 구체적으로 적어주세요.
      placeholder: |
        -
        -
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: OUT Scope
      description: 이번 작업에 포함하지 않을 항목을 적어 scope creep을 방지하세요. 없으면 `없음`으로 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 예상 범위
      description: 현재 예상되는 범위를 모두 선택하세요.
      multiple: true
      options:
        - Backend
        - Frontend
        - Agent
        - Infrastructure / CI/CD
        - Database
        - Documentation
        - GitHub configuration
        - Production operations
        - Unknown
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 구현 전에 test 또는 observable evidence로 판정할 수 있는 기준을 적어주세요.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Preconditions
      description: 선행 Issue, branch 상태, accepted ADR, configuration 또는 실행 전에 충족할 조건을 적어주세요. 없으면 `없음`으로 적어주세요.
    validations:
      required: true

  - type: textarea
    id: impacts
    attributes:
      label: Contract / Impact
      description: 각 항목의 영향과 변경 계약을 적어주세요. 영향이 없으면 `없음`과 근거를 적어주세요.
      placeholder: |
        API Impact:
        Data / Migration Impact:
        Security / Privacy Impact:
        Agent Impact:
        Infrastructure / CI Impact:
        Documentation Impact:
    validations:
      required: true

  - type: textarea
    id: delivery
    attributes:
      label: Delivery / Production Contract
      description: Migration, release classification과 production gate를 항목별로 확정하세요.
      placeholder: |
        DB migration compatibility:
        API/Web deployment:
        Agent artifact classification:
        Agent release classification:
        Secret / credential:
        Kill switch / activation:
        Preflight Gate:
        Rollback / Recovery:
        Post-merge Acceptance:
    validations:
      required: true

  - type: input
    id: expected_branch
    attributes:
      label: Expected Branch
      description: latest integration base에서 만들 work branch의 exact 이름을 적어주세요.
      placeholder: feat/example 또는 chore/example
    validations:
      required: true

  - type: dropdown
    id: pr_target
    attributes:
      label: PR Target
      description: 일반 Issue는 dev, dev 승격 Release PR만 main을 선택하세요.
      options:
        - dev — 일반 Issue integration
        - main — Release / Production 승격
        - Other — accepted decision 필요
    validations:
      required: true

  - type: dropdown
    id: production_mutation
    attributes:
      label: Production Mutation
      description: 이 Issue workflow에서 허용되는 가장 높은 production mutation 수준을 선택하세요.
      options:
        - None — source/PR까지만 수행
        - Read-only acceptance
        - Controlled mutation — 별도 Ops 승인 필요
        - Production change — 별도 Release/Ops 승인 필요
        - Unknown — preflight decision 필요
    validations:
      required: true

  - type: textarea
    id: test_strategy
    attributes:
      label: Test Strategy
      description: Focused, regression, full local, Hosted CI와 production acceptance evidence를 구분해 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 관련 Phase / Roadmap
      options:
        - Phase 1 — 읽기 전용 대시보드
        - Phase 2 — Native Agent rollout
        - Phase 3 — 운영 이력
        - Phase 4 — 알림
        - Phase 5 — 제한된 컨테이너 제어
        - Repository governance
        - 기타 / 미정
    validations:
      required: true

  - type: textarea
    id: follow_up
    attributes:
      label: Follow-up
      description: 이번 Issue 이후 별도 Issue, release 또는 production acceptance로 남길 항목을 적어주세요. 없으면 `없음`으로 적어주세요.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 추가 context
      description: 관련 Issue, PR, ADR, mockup 또는 조사 자료가 있으면 적어주세요. 민감정보는 포함하지 마세요.
    validations:
      required: false
