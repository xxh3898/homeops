name: Feature / Improvement
description: 신규 기능 또는 범위가 명확한 개선을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        구현 방법보다 해결하려는 문제와 검증 가능한 완료 조건을 먼저 작성하세요.

  - type: textarea
    id: background
    attributes:
      label: 문제 / 배경
      description: 현재 어떤 제약이나 불편이 있으며 왜 해결해야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 완료되면 사용자나 운영 상태가 어떻게 달라져야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 구현 전에 test 또는 observable evidence로 판정할 수 있는 기준을 적어주세요.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 예상 범위
      description: 현재 예상되는 범위를 모두 선택하세요.
      multiple: true
      options:
        - Backend
        - Frontend
        - Agent
        - Infrastructure / CI/CD
        - Database
        - Documentation
        - Unknown
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: 이번 작업에 포함하지 않을 항목을 적어 scope creep을 방지하세요. 없으면 `없음`으로 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 관련 Phase / Roadmap
      options:
        - Phase 1 — 읽기 전용 대시보드
        - Phase 2 — Native Agent rollout
        - Phase 3 — 운영 이력
        - Phase 4 — 알림
        - Phase 5 — 제한된 컨테이너 제어
        - 기타 / 미정
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 추가 context
      description: 관련 Issue, PR, ADR, mockup 또는 조사 자료가 있으면 적어주세요. 민감정보는 포함하지 마세요.
    validations:
      required: false
