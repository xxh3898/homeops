server_tokens off;
limit_req_zone $binary_remote_addr zone=homeops_agent_ingress:1m rate=5r/s;

upstream homeops_api {
    server api:8080;
    keepalive 8;
}

map $sent_http_content_type $homeops_cache_control {
    default "no-cache";
    ~*text/html "no-cache, no-store, must-revalidate";
    ~*javascript "public, max-age=31536000, immutable";
    ~*css "public, max-age=31536000, immutable";
    ~*image "public, max-age=86400";
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location /api/ {
        proxy_pass http://homeops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header Tailscale-User-Name $http_tailscale_user_name;
        proxy_set_header Tailscale-User-Profile-Pic $http_tailscale_user_profile_pic;
        proxy_set_header X-HomeOps-Agent-Verified "";
    }

    location = /actuator/health/readiness {
        proxy_pass http://homeops_api;
        proxy_set_header Host localhost;
        proxy_set_header X-HomeOps-Agent-Verified "";
        proxy_set_header Tailscale-User-Login "";
    }

    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $homeops_cache_control always;
    }
}

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/homeops/tls/server.crt;
    ssl_certificate_key /run/homeops/tls/server.key;
    ssl_client_certificate /run/homeops/tls/ca.crt;
    ssl_verify_client on;
    ssl_session_tickets off;
    client_max_body_size 512k;
    client_body_timeout 10s;

    location = /api/v1/internal/agent/snapshots {
        limit_except POST { deny all; }
        limit_req zone=homeops_agent_ingress burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://homeops_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header Tailscale-User-Login "";
        proxy_set_header Tailscale-User-Name "";
        proxy_set_header Tailscale-User-Profile-Pic "";
        proxy_set_header X-HomeOps-Agent-Verified $ssl_client_verify;
    }

    location / {
        return 404;
    }
}
