spring:
  application:
    name: homeops
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/homeops}
    username: ${SPRING_DATASOURCE_USERNAME:homeops}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${HOMEOPS_DB_POOL_SIZE:5}
      minimum-idle: ${HOMEOPS_DB_MIN_IDLE:1}
  flyway:
    enabled: ${HOMEOPS_FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

server:
  forward-headers-strategy: none
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${HOMEOPS_SESSION_COOKIE_SECURE:true}
        same-site: strict
      timeout: 12h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

homeops:
  security:
    mode: ${HOMEOPS_AUTH_MODE:TAILSCALE}
    allowed-users: ${HOMEOPS_ALLOWED_USERS:}
  agent:
    expected-id: ${HOMEOPS_AGENT_ID:local-mac}
    stale-after: ${HOMEOPS_AGENT_STALE_AFTER:30s}
    maximum-snapshot-age: ${HOMEOPS_AGENT_MAXIMUM_SNAPSHOT_AGE:5m}
    allowed-future-skew: ${HOMEOPS_AGENT_ALLOWED_FUTURE_SKEW:1m}
    maximum-containers: ${HOMEOPS_AGENT_MAXIMUM_CONTAINERS:128}
    processed-snapshot-retention: ${HOMEOPS_AGENT_PROCESSED_SNAPSHOT_RETENTION:1d}
    processed-snapshot-cleanup-cron: ${HOMEOPS_AGENT_PROCESSED_SNAPSHOT_CLEANUP_CRON:0 47 3 * * *}
  metrics:
    retention: ${HOMEOPS_METRIC_RETENTION:30d}
    cleanup-cron: ${HOMEOPS_METRIC_CLEANUP_CRON:0 17 3 * * *}
  ingestion:
    shared-secret: ${HOMEOPS_INGESTION_SHARED_SECRET:}
    maximum-request-age: ${HOMEOPS_INGESTION_MAXIMUM_REQUEST_AGE:5m}
    allowed-future-skew: ${HOMEOPS_INGESTION_ALLOWED_FUTURE_SKEW:1m}
  monitoring:
    allowed-origins: ${HOMEOPS_MONITORING_ALLOWED_ORIGINS:}
    healthy-result-retention: ${HOMEOPS_HEALTHY_RESULT_RETENTION:7d}
    failure-result-retention: ${HOMEOPS_FAILURE_RESULT_RETENTION:30d}
    max-concurrent-checks: ${HOMEOPS_MONITORING_MAX_CONCURRENT_CHECKS:4}
    scheduler-delay: ${HOMEOPS_MONITORING_SCHEDULER_DELAY:5s}
    cleanup-cron: ${HOMEOPS_MONITORING_CLEANUP_CRON:0 29 3 * * *}
  notifications:
    enabled: ${HOMEOPS_NOTIFICATIONS_ENABLED:false}
    agent:
      freshness-check-delay: ${HOMEOPS_AGENT_NOTIFICATION_FRESHNESS_CHECK_DELAY:5s}
    container:
      failure-after: ${HOMEOPS_CONTAINER_NOTIFICATION_FAILURE_AFTER:30s}
      realert-cooldown: ${HOMEOPS_CONTAINER_NOTIFICATION_REALERT_COOLDOWN:5m}
    incident:
      escalation-after: ${HOMEOPS_INCIDENT_NOTIFICATION_ESCALATION_AFTER:15m}
    discord-webhook-url: ${HOMEOPS_DISCORD_WEBHOOK_URL:}
    connect-timeout: ${HOMEOPS_NOTIFICATION_CONNECT_TIMEOUT:3s}
    request-timeout: ${HOMEOPS_NOTIFICATION_REQUEST_TIMEOUT:5s}
    lease-duration: ${HOMEOPS_NOTIFICATION_LEASE_DURATION:30s}
    poll-delay: ${HOMEOPS_NOTIFICATION_POLL_DELAY:1s}
    batch-size: ${HOMEOPS_NOTIFICATION_BATCH_SIZE:10}
    max-attempts: ${HOMEOPS_NOTIFICATION_MAX_ATTEMPTS:6}
    initial-backoff: ${HOMEOPS_NOTIFICATION_INITIAL_BACKOFF:5s}
    max-backoff: ${HOMEOPS_NOTIFICATION_MAX_BACKOFF:15m}
    response-max-bytes: ${HOMEOPS_NOTIFICATION_RESPONSE_MAX_BYTES:65536}
    payload-max-bytes: ${HOMEOPS_NOTIFICATION_PAYLOAD_MAX_BYTES:8192}
    sent-retention: ${HOMEOPS_NOTIFICATION_SENT_RETENTION:30d}
    failed-retention: ${HOMEOPS_NOTIFICATION_FAILED_RETENTION:90d}
    cleanup-cron: ${HOMEOPS_NOTIFICATION_CLEANUP_CRON:0 41 3 * * *}
